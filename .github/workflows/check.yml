name: CI - Code Quality & Build Checks

on:
  pull_request:
    branches: [main, enterprise, development]
  push:
    branches: [main, enterprise, development]
  workflow_dispatch:

jobs:
  client-ci:
    name: Client Lint & Build Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Prepare Dummy Environment
        run: cp .env.example .env

      - name: Verify Client Production Build
        run: npm run build

  server-ci:
    name: Server Syntax & Integration Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Syntax & Module Validation
        run: |
          node --check app.js
          node --check worker.mjs

  notify-on-failure:
    name: Send Failure Email Alert
    needs: [client-ci, server-ci]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Resolve GitHub Account Email
        id: recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EMAIL="${{ github.event.head_commit.author.email }}"
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            PUSHER_EMAIL="${{ github.event.pusher.email }}"
            if [ -n "$PUSHER_EMAIL" ] && [ "$PUSHER_EMAIL" != "null" ] && [[ "$PUSHER_EMAIL" != *"noreply"* ]]; then
              EMAIL="$PUSHER_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            API_EMAIL=$(gh api users/${{ github.actor }} --jq '.email // empty' 2>/dev/null || true)
            if [ -n "$API_EMAIL" ] && [ "$API_EMAIL" != "null" ]; then
              EMAIL="$API_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            if [ -n "${{ secrets.ALERT_EMAIL }}" ]; then
              EMAIL="${{ secrets.ALERT_EMAIL }}"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
            EMAIL="${{ github.event.head_commit.author.email || github.event.pusher.email }}"
          fi
          echo "Resolved recipient email: $EMAIL"
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Send Alert Email
        if: steps.recipient.outputs.email != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.mailer91.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 CI Failure: ${{ github.repository }} [${{ github.ref_name }}]"
          to: ${{ steps.recipient.outputs.email }}
          from: "Exim CI/CD Alert <${{ secrets.SMTP_USER }}>"
          html_body: |
            <h2>🚨 GitHub Actions CI Check Failed</h2>
            <p>A build or validation check has failed on repository: <strong>${{ github.repository }}</strong></p>
            <ul>
              <li><strong>Branch:</strong> ${{ github.ref_name }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Author:</strong> ${{ github.actor }}</li>
              <li><strong>Triggered By:</strong> ${{ github.event_name }}</li>
              <li><strong>Run Details:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Action Run Log</a></li>
            </ul>
            <p>Please inspect the workflow logs and address the failing checks before merging.</p>
