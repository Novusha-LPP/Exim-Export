name: Release - Deploy to Production

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  deploy-client-prod:
    name: Build & Deploy Production Client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Inject Production Client Environment (.env)
        run: |
          cat <<EOF > client/.env
          VITE_API_STRING=${{ secrets.PROD_VITE_API_STRING || 'https://eximbot.alvision.in/export/api' }}
          VITE_IMPORT_API_STRING=${{ secrets.PROD_VITE_IMPORT_API_STRING || 'https://eximbot.alvision.in/import/api' }}
          VITE_VERSION=${{ github.ref_name }}
          FAST_REFRESH=false
          GENERATE_SOURCEMAP=true
          VITE_TALLY_KEY=${{ secrets.PROD_VITE_TALLY_KEY }}
          EOF

      - name: Build Production Client Bundle
        run: |
          cd client
          npm run build

      - name: Configure AWS Credentials (S3 Production Bucket)
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.PROD_AWS_S3_CLIENT_BUCKET != '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-south-1' }}

      - name: Sync Production Static Assets to AWS S3
        if: "${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.PROD_AWS_S3_CLIENT_BUCKET != '' }}"
        run: |
          aws s3 sync client/dist s3://${{ secrets.PROD_AWS_S3_CLIENT_BUCKET }} --delete

  deploy-server-prod:
    name: Build & Publish Production Server Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: "${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Production Docker Image
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME || 'punit084' }}/export-main"
          docker build \
            --no-cache \
            -t ${IMAGE_TAG}:latest \
            -t ${IMAGE_TAG}:${{ github.sha }} \
            server/

          if [ "${{ secrets.DOCKERHUB_TOKEN }}" != "" ]; then
            docker push ${IMAGE_TAG}:latest
            docker push ${IMAGE_TAG}:${{ github.sha }}
          else
            echo "DOCKERHUB_TOKEN not configured. Skipping docker push step."
          fi

      - name: Deploy to Remote Production Server via SSH (Optional)
        if: "${{ secrets.PROD_SSH_HOST != '' && secrets.PROD_SSH_KEY != '' }}"
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER || 'ubuntu' }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            echo "Pulling latest production image and updating service..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME || 'punit084' }}/export-main:latest
            # Run docker compose up -d or container restart script

  notify-on-failure:
    name: Send Production Failure Alert Email
    needs: [deploy-client-prod, deploy-server-prod]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Resolve GitHub Account Email
        id: recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EMAIL="${{ github.event.head_commit.author.email }}"
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            PUSHER_EMAIL="${{ github.event.pusher.email }}"
            if [ -n "$PUSHER_EMAIL" ] && [ "$PUSHER_EMAIL" != "null" ] && [[ "$PUSHER_EMAIL" != *"noreply"* ]]; then
              EMAIL="$PUSHER_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            API_EMAIL=$(gh api users/${{ github.actor }} --jq '.email // empty' 2>/dev/null || true)
            if [ -n "$API_EMAIL" ] && [ "$API_EMAIL" != "null" ]; then
              EMAIL="$API_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            if [ -n "${{ secrets.ALERT_EMAIL }}" ]; then
              EMAIL="${{ secrets.ALERT_EMAIL }}"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
            EMAIL="${{ github.event.head_commit.author.email || github.event.pusher.email }}"
          fi
          echo "Resolved recipient email: $EMAIL"
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Send Alert Email
        if: steps.recipient.outputs.email != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.mailer91.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 CRITICAL: Production Release Failed for ${{ github.repository }} [${{ github.ref_name }}]"
          to: ${{ steps.recipient.outputs.email }}
          from: "Exim Production Alert <${{ secrets.SMTP_USER }}>"
          html_body: |
            <h2 style="color: #d32f2f;">🚨 CRITICAL: Production Release Deployment Failed</h2>
            <p>A production deployment has failed on repository: <strong>${{ github.repository }}</strong></p>
            <ul>
              <li><strong>Branch/Tag:</strong> ${{ github.ref_name }}</li>
              <li><strong>Commit SHA:</strong> ${{ github.sha }}</li>
              <li><strong>Released By:</strong> ${{ github.actor }}</li>
              <li><strong>Triggered By:</strong> ${{ github.event_name }}</li>
              <li><strong>Workflow Run Logs:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Action Run</a></li>
            </ul>
            <p style="color: #b71c1c; font-weight: bold;">Production services may be in an inconsistent state. Please check immediately.</p>
