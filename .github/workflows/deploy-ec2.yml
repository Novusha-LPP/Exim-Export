name: Deploy to EC2 (Enterprise)

on:
  push:
    branches: [enterprise]
  workflow_dispatch:

jobs:
  deploy-to-ec2:
    name: Deploy Docker Compose to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "=========================================================="
            echo "🚀 Deploying latest 'enterprise' branch to EC2..."
            echo "=========================================================="

            # Navigate to or clone the repository directory on EC2
            if [ ! -d "$HOME/Exim-Export" ]; then
              echo "Repository not found at $HOME/Exim-Export. Cloning enterprise branch..."
              git clone -b enterprise https://github.com/Novusha-LPP/Exim-Export.git "$HOME/Exim-Export"
            fi
            cd "$HOME/Exim-Export"

            # Fetch latest changes from enterprise branch
            echo "📥 Pulling latest commits from enterprise..."
            git fetch origin enterprise
            git checkout enterprise
            git reset --hard origin/enterprise

            # Ensure server/.env exists so docker compose doesn't fail
            if [ ! -f "server/.env" ]; then
              if [ -f "server/.env.example" ]; then
                echo "⚠️ server/.env not found! Initializing from server/.env.example..."
                cp server/.env.example server/.env
              else
                touch server/.env
              fi
            fi

            # Build and restart containers using Docker Compose
            echo "📦 Building images and starting containers..."
            docker compose up -d --build --remove-orphans

            # Clean up old unused build cache images to save disk space
            docker image prune -f

            echo "=========================================================="
            echo "✅ Deployment successful! Active containers:"
            echo "=========================================================="
            docker compose ps

  notify-on-failure:
    name: Send EC2 Deployment Failure Alert Email
    needs: [deploy-to-ec2]
    if: failure()
    runs-on: ubuntu-latest

    steps:
      - name: Resolve GitHub Account Email
        id: recipient
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EMAIL="${{ github.event.head_commit.author.email }}"
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            PUSHER_EMAIL="${{ github.event.pusher.email }}"
            if [ -n "$PUSHER_EMAIL" ] && [ "$PUSHER_EMAIL" != "null" ] && [[ "$PUSHER_EMAIL" != *"noreply"* ]]; then
              EMAIL="$PUSHER_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            API_EMAIL=$(gh api users/${{ github.actor }} --jq '.email // empty' 2>/dev/null || true)
            if [ -n "$API_EMAIL" ] && [ "$API_EMAIL" != "null" ]; then
              EMAIL="$API_EMAIL"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ] || [[ "$EMAIL" == *"noreply"* ]]; then
            if [ -n "${{ secrets.ALERT_EMAIL }}" ]; then
              EMAIL="${{ secrets.ALERT_EMAIL }}"
            fi
          fi
          if [ -z "$EMAIL" ] || [ "$EMAIL" = "null" ]; then
            EMAIL="${{ github.event.head_commit.author.email || github.event.pusher.email }}"
          fi
          echo "Resolved recipient email: $EMAIL"
          echo "email=$EMAIL" >> $GITHUB_OUTPUT

      - name: Send Alert Email
        if: steps.recipient.outputs.email != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST || 'smtp.mailer91.com' }}
          server_port: ${{ secrets.SMTP_PORT || 587 }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚨 EC2 Deployment Failed for ${{ github.repository }} [${{ github.ref_name }}]"
          to: ${{ steps.recipient.outputs.email }}
          from: "Exim EC2 Deployment <${{ secrets.SMTP_USER }}>"
          html_body: |
            <h2 style="color: #d32f2f;">🚨 EC2 Auto-Deployment Failed</h2>
            <p>An automated deployment to EC2 has failed on branch: <strong>${{ github.ref_name }}</strong></p>
            <ul>
              <li><strong>Repository:</strong> ${{ github.repository }}</li>
              <li><strong>Commit:</strong> ${{ github.sha }}</li>
              <li><strong>Triggered By:</strong> ${{ github.actor }} (${{ github.event_name }})</li>
              <li><strong>Action Run Logs:</strong> <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Deployment Logs</a></li>
            </ul>
            <p style="color: #c62828; font-weight: bold;">Please check the logs to verify SSH connectivity or Docker build output on the EC2 server.</p>
